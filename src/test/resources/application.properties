# Configuração do Banco de Dados para Testes (H2 em memória)

# URL de conexão para o banco de dados H2 em memória.
# "testdb" é o nome do banco de dados que será criado na memória.
spring.datasource.url=jdbc:h2:mem:testdb

# Driver JDBC para o banco de dados H2.
spring.datasource.driverClassName=org.h2.Driver

# Nome de usuário para o banco de dados H2.
spring.datasource.username=sa

# Senha para o banco de dados H2 (pode ser deixada em branco).
spring.datasource.password=

# Dialeto do Hibernate para o H2, para que o JPA saiba como se comunicar com o banco.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Ação a ser tomada no banco de dados ao iniciar a aplicação.
# "create-drop" cria o schema no início e o destrói no final. Perfeito para testes.
spring.jpa.hibernate.ddl-auto=create-drop

spring:
  datasource:
    # A linha abaixo diz ao Spring para usar o driver do PostgreSQL
    driver-class-name: org.postgresql.Driver
    # O endereço, usuário e senha do banco de dados agora são lidos das variáveis de ambiente
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update # Cria/atualiza as tabelas automaticamente
    show-sql: true # Mostra os comandos SQL no log, útil para debug
    properties:
      hibernate:
        format_sql: true




